<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Reportes - SPR</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root { --primary: #122342; --secondary: #9F2241; --light: #F4F6F9; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; background: var(--light); color: #333; }
        header { background: var(--primary); color: white; padding: 15px; text-align: center; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .container { padding: 20px; max-width: 500px; margin: 0 auto; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; }
        label { font-weight: bold; display: block; margin-bottom: 8px; color: var(--primary); }
        select, input[type="file"] { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 16px; }
        .btn { background: var(--secondary); color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.3s; }
        .btn:hover { background: #7A1A31; }
        .step-box { background: #E9EDF5; border-left: 4px solid var(--primary); padding: 15px; margin-top: 15px; border-radius: 0 5px 5px 0; display: none; }
    </style>
</head>
<body>

    <header>SPR - Control de Mantenimiento</header>

    <div class="container">
        <div class="card" id="setup-card">
            <label for="estacion">📍 Seleccionar Estación:</label>
            <select id="estacion">
                <option value="">-- Selecciona una opción --</option>
                <option value="guadalajara">Guadalajara</option>
            </select>

            <label for="mantenimiento">🛠️ Tipo de Mantenimiento:</label>
            <select id="mantenimiento" disabled>
                <option value="">-- Primero selecciona estación --</option>
                <option value="01_diesel">01 - Mantenimiento a tanques de diésel</option>
            </select>
            
            <button class="btn" id="btn-iniciar" onclick="iniciarFlujo()" disabled>Iniciar Captura Guiada</button>
        </div>

        <div class="card" id="capture-card" style="display: none;">
            <h3 id="step-title">Paso 1: Seguridad Perimetral</h3>
            <p id="step-desc">Tome una fotografía que demuestre la presencia de extintores y delimitación del área de trabajo.</p>
            
            <input type="file" accept="image/*" capture="environment" id="camera-input" onchange="procesarFoto()">
            
            <div class="step-box" id="ia-feedback">
                <strong>🤖 Agente de IA analizando...</strong>
                <p id="ia-text">Esperando fotografía...</p>
            </div>
        </div>
    </div>

    <script>
        const estacionSel = document.getElementById('estacion');
        const mantenimientoSel = document.getElementById('mantenimiento');
        const btnIniciar = document.getElementById('btn-iniciar');

        // Habilitar opciones del menú secuencialmente
        estacionSel.addEventListener('change', () => {
            if(estacionSel.value === 'guadalajara') {
                mantenimientoSel.disabled = false;
                mantenimientoSel.options[0].text = "-- Selecciona el mantenimiento --";
            } else {
                mantenimientoSel.disabled = true;
                btnIniciar.disabled = true;
            }
        });

        mantenimientoSel.addEventListener('change', () => {
            if(mantenimientoSel.value !== "") {
                btnIniciar.disabled = false;
            } else {
                btnIniciar.disabled = true;
            }
        });

        function iniciarFlujo() {
            document.getElementById('setup-card').style.display = 'none';
            document.getElementById('capture-card').style.display = 'block';
        }

        function procesarFoto() {
            const feedback = document.getElementById('ia-feedback');
            const iaText = document.getElementById('ia-text');
            feedback.style.display = 'block';
            iaText.innerText = "Foto recibida. Validando con el Anexo del manual de procedimientos e imitando el formato aprobado...";
            
            // Aquí se conectará la API del agente de IA en la Fase 2
        }

        // Registro del Service Worker para la PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
